<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<title>🧊 Claude Code 3D</title>
<link rel="stylesheet" href="styles.css">
</head><body>

<div class="coord" id="coord">[0,0,0]</div>
<div class="status" id="status">Ready</div>
<div class="help">WASD:XY QE:Z ^S:Save ^I:AI ^L:Login</div>

<div id="auth" class="modal">
  <h2>🔐 Setup</h2>
  <input id="inp_token" placeholder="GitHub Token (ghp_...)">
  <input id="inp_repo" placeholder="owner/repo">
  <input id="inp_key" placeholder="Claude Key (sk-ant-...)">
  <button id="btn_save">Save & Start</button>
  <p class="hint">Get tokens from github.com/settings/tokens & console.anthropic.com</p>
</div>

<div class="cube">
  <div class="cell" id="c0"></div>
  <div class="cell" id="c1"></div>
  <div class="cell" id="c2"></div>
  <div class="cell" id="c3"></div>
  <div class="cell center" id="c4"><textarea id="ed"></textarea></div>
  <div class="cell" id="c5"></div>
  <div class="cell" id="c6"></div>
  <div class="cell" id="c7"></div>
  <div class="cell" id="c8"></div>
</div>

<script type="module">
import { App } from './src/app.js';

const app = new App();

// Auth UI
document.getElementById('btn_save').onclick = () => {
  app.auth.setGitHub(document.getElementById('inp_token').value);
  app.auth.setRepo(document.getElementById('inp_repo').value);
  app.auth.setClaude(document.getElementById('inp_key').value);
  location.reload();
};

// Check auth & init
if (app.auth.isReady()) {
  document.getElementById('auth').classList.add('hidden');
}
app.init();
</script>
</body></html>
