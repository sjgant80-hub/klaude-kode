<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<title>🧊 Claude Code 3D</title>
<link rel="stylesheet" href="styles.css">
</head><body>

<div class="page landing">
  <h1>🧊 Claude Code 3D</h1>
  <p class="tagline">3D code navigation with embedded AI</p>

  <div class="features">
    <div class="feature">📁 Navigate files in 3D space</div>
    <div class="feature">🤖 Claude AI at every coordinate</div>
    <div class="feature">⚡ Direct GitHub sync</div>
  </div>

  <nav class="main-nav">
    <a href="pages/editor.html" class="btn-primary">Open Editor</a>
    <a href="pages/files.html" class="btn">Browse Files</a>
    <a href="pages/settings.html" class="btn">Settings</a>
  </nav>

  <p class="hint" id="status"></p>
</div>

<script type="module">
import { Auth } from './src/auth.js';
const auth = new Auth();

const status = document.getElementById('status');
if (auth.isReady()) {
  status.innerHTML = `✓ Connected to <b>${auth.getRepo()}</b>`;
} else {
  status.innerHTML = '<a href="pages/auth.html">Login to get started →</a>';
}
</script>
</body></html>
