<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<title>🧊 Claude Code 3D</title>
<link rel="stylesheet" href="styles.css">
</head><body>

<div class="coord" id="coord">[0,0,0]</div>
<div class="status" id="status">Ready</div>
<div class="help">WASD:XY QE:Z ^S:Save ^I:AI</div>

<div id="auth" class="modal">
  <h2>🧊 Claude Code 3D</h2>
  <p class="repo" id="repo">Repo: detecting...</p>

  <div class="auth-step">
    <span class="check" id="chk_gh">○</span>
    <a id="btn_gh" href="#" target="_blank">Login with GitHub</a>
    <input id="inp_gh" placeholder="paste token here" class="hidden">
  </div>

  <div class="auth-step">
    <span class="check" id="chk_cl">○</span>
    <a id="btn_cl" href="#" target="_blank">Get Claude API Key</a>
    <input id="inp_cl" placeholder="paste key here" class="hidden">
  </div>

  <button id="btn_save" class="hidden">Start Coding →</button>
</div>

<div class="cube">
  <div class="cell" id="c0"></div>
  <div class="cell" id="c1"></div>
  <div class="cell" id="c2"></div>
  <div class="cell" id="c3"></div>
  <div class="cell center" id="c4"><textarea id="ed"></textarea></div>
  <div class="cell" id="c5"></div>
  <div class="cell" id="c6"></div>
  <div class="cell" id="c7"></div>
  <div class="cell" id="c8"></div>
</div>

<script type="module">
import { App } from './src/app.js';
const app = new App();

// Show detected repo
const repo = app.auth.getRepo();
document.getElementById('repo').textContent = repo ? `Repo: ${repo}` : 'Repo: set manually below';

// Set OAuth URLs
document.getElementById('btn_gh').href = app.auth.gitHubTokenUrl();
document.getElementById('btn_cl').href = app.auth.anthropicUrl();

// Show/hide based on auth state
const updateUI = () => {
  const hasGh = app.auth.hasGitHub();
  const hasCl = app.auth.hasClaude();
  document.getElementById('chk_gh').textContent = hasGh ? '✓' : '○';
  document.getElementById('chk_cl').textContent = hasCl ? '✓' : '○';
  document.getElementById('inp_gh').classList.toggle('hidden', hasGh);
  document.getElementById('inp_cl').classList.toggle('hidden', hasCl);
  document.getElementById('btn_save').classList.toggle('hidden', !(hasGh && hasCl));
};
updateUI();

// Save tokens on paste
document.getElementById('inp_gh').onchange = e => { app.auth.setGitHub(e.target.value); updateUI(); };
document.getElementById('inp_cl').onchange = e => { app.auth.setClaude(e.target.value); updateUI(); };

// Start button
document.getElementById('btn_save').onclick = () => {
  document.getElementById('auth').classList.add('hidden');
  app.init();
};

// Auto-start if ready
if (app.auth.isReady()) {
  document.getElementById('auth').classList.add('hidden');
  app.init();
}
</script>
</body></html>
