<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<title>⚙️ Settings - Claude Code 3D</title>
<link rel="stylesheet" href="../styles.css">
</head><body>

<div class="page">
  <h1>⚙️ Settings</h1>

  <div class="setting">
    <label>GitHub Token</label>
    <input id="gh_token" type="password" placeholder="ghp_...">
    <span class="status-dot" id="gh_status">○</span>
  </div>

  <div class="setting">
    <label>Repository</label>
    <input id="gh_repo" placeholder="owner/repo">
  </div>

  <div class="setting">
    <label>Claude API Key (optional)</label>
    <input id="ant_key" type="password" placeholder="sk-ant-...">
    <span class="status-dot" id="cl_status">○</span>
  </div>

  <div class="setting">
    <label>Grid Size</label>
    <input id="grid_size" type="number" value="100" min="10" max="1000">
  </div>

  <button id="btn_save">Save Settings</button>
  <button id="btn_clear" class="danger">Clear All Data</button>

  <nav class="nav">
    <a href="editor.html">Editor</a>
    <a href="files.html">Files</a>
    <a href="auth.html">Re-login</a>
  </nav>
</div>

<script type="module">
const $ = id => document.getElementById(id);
const ls = localStorage;

// Load current values
$('gh_token').value = ls.gh_token || '';
$('gh_repo').value = ls.gh_repo || '';
$('ant_key').value = ls.ant_key || '';
$('grid_size').value = ls.grid_size || '100';

$('gh_status').textContent = ls.gh_token ? '✓' : '○';
$('cl_status').textContent = ls.ant_key ? '✓' : '○';

$('btn_save').onclick = () => {
  ls.gh_token = $('gh_token').value;
  ls.gh_repo = $('gh_repo').value;
  ls.ant_key = $('ant_key').value;
  ls.grid_size = $('grid_size').value;
  alert('Saved!');
  location.reload();
};

$('btn_clear').onclick = () => {
  if (confirm('Clear all data?')) {
    ls.clear();
    location.href = 'auth.html';
  }
};
</script>
</body></html>
